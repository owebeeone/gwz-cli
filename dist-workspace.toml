[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Publish jobs to run in CI
publish-jobs = ["./publish-crate"]
# Replaces dist's default publish-job grant (id-token and packages write). A
# called workflow can only narrow what its caller job grants, and publish-crate.yml
# checks out the release tag and exchanges an OIDC token for a crates.io token
# (gwz-core dev-docs/GwzCratesIoPlan.md S3.2).
github-custom-job-permissions = { "publish-crate" = { contents = "read", id-token = "write" } }
# Whether to install an updater program
install-updater = false
# The generated workflow is intentionally hand-constrained to explicit release events.
allow-dirty = ["ci"]
# Generate GitHub Artifact Attestations for release assets
github-attestations = true
github-attestations-phase = "announce"
github-attestations-filters = [
    "*.json",
    "*.sh",
    "*.ps1",
    "*.zip",
    "*.tar.xz",
    "*.sha256",
    "sha256.sum",
]
