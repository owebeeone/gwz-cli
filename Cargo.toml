[package]
name = "gwz"
version = "1.0.14"
edition = "2024"
license = "GPL-2.0-only"
rust-version = "1.95"
description = "Command-line driver for GWZ multi-repository workspaces."
repository = "https://github.com/owebeeone/gwz-cli"
readme = "README.md"
keywords = ["git", "workspace", "monorepo", "gwz", "cli"]
categories = ["command-line-utilities", "development-tools"]
# What the registry package carries (gwz-core dev-docs/GwzCratesIoPlan.md D4):
# only what a build of the `gwz` binary needs. `build.rs` reaches
# `build_support/provenance.rs` through `#[path]`, so both are inside the
# package. Every `include_str!` that leaves `src/` (docs pages, `tests/fixtures`
# and gwz-core's parity fixtures through `../gwz-core`) sits under `src/tests/`,
# which `src/lib.rs` compiles only for `cfg(test)`, so a build never reads them;
# they stay in git with the tests, dev-docs, docs, scripts, the mkdocs site and
# the bootstrap package under `.github/`. A registry build reports
# `revision=unavailable` with a digest of the packaged sources.
# Every pattern is anchored with a leading `/`: an `include` list is matched
# gitignore-style and overrides `.gitignore`, so an unanchored `README.md`
# would also carry `docs/README.md` and `.github/bootstrap-crate/README.md`.
include = [
  "/Cargo.toml",
  "/build.rs",
  "/build_support/**",
  "/src/**",
  "/LICENSE",
  "/README.md",
]

[package.metadata.dist]
dist = true

[[bin]]
name = "gwz"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
console = "0.16"
gwz-core = "=1.0.14"
serde_json = "1"

[dev-dependencies]
git2 = "0.21"
sha2 = "0.10"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[build-dependencies]
sha2 = "0.10"
